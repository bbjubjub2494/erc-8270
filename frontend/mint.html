<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mint | ERC-8270</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#333333">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Mint | ERC-8270</h1>
            <p style="color: #9ca3af;">Create a new token</p>
        </header>

        <main id="app">
            <div class="token-info">
                <div class="mint-form">
                    <div class="form-group">
                        <label for="walletAddress" class="form-label">Wallet Address</label>
                        <div class="wallet-status" id="walletStatus">
                            <button class="connect-button" id="connectButton">Connect Wallet</button>
                            <div class="wallet-connected" id="walletConnected" style="display: none;">
                                <span id="walletAddress">0x0000...0000</span>
                                <span class="connected-badge">Connected</span>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="validatorKey" class="form-label">Validator Public Key</label>
                        <input
                            type="text"
                            class="form-input"
                            id="validatorKey"
                            placeholder="0x..."
                            disabled
                        >
                        <p class="form-hint">Enter the 48-byte validator public key (96 hex characters)</p>
                    </div>

                    <button class="mint-button" id="mintButton" disabled>
                        Mint NFT
                    </button>

                    <div class="status-message" id="statusMessage" style="display: none;"></div>
                </div>
            </div>

            <div class="validator-status">
                <div class="status-title">Transaction Status</div>
                <div class="status-grid">
                    <div class="status-item">
                        <span class="status-label">Transaction Hash</span>
                        <span class="status-value" id="txHash">-</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Token ID</span>
                        <span class="status-value" id="tokenId">-</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Status</span>
                        <span class="status-value" id="txStatus">Not Started</span>
                    </div>
                </div>
            </div>

            <div class="navigation">
                <a href="/" class="nav-link">← Back to View Tokens</a>
                <span style="margin: 0 1rem; color: #333;">|</span>
                <a href="/deposit.html" class="nav-link">Deposit to Validator</a>
            </div>
        </main>
    </div>

    <script type="module" src="/mint.js"></script>
</body>
</html>
